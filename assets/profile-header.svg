<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Lanakod</title>
  <desc id="desc">A dark blue developer banner with the motto Build. Ship. Operate. and a geometric terminal symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101722" />
      <stop offset="0.6" stop-color="#0D1420" />
      <stop offset="1" stop-color="#112B37" />
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="1150" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" />
      <stop offset="1" stop-color="#5EEAD4" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7A9CB7" opacity="0.14" />
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="280" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="280" fill="url(#background)" />
    <rect x="700" width="500" height="280" fill="url(#grid)" />
    <path d="M768 0V280M1024 0V280M700 56H1200M700 224H1200" stroke="#8DC6DD" stroke-opacity="0.06" />
    <path d="M0 279H1200" stroke="url(#accent)" stroke-opacity="0.65" stroke-width="2" />

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="56" y="46" width="6" height="6" rx="1" fill="#5EEAD4" />
      <text x="75" y="55" font-size="13" font-weight="600" letter-spacing="3" fill="#94ADC3">CODE / SYSTEMS / INFRASTRUCTURE</text>
      <text x="50" y="159" font-size="92" font-weight="750" letter-spacing="-4" fill="#F0F6FC">LANAKOD<tspan fill="#5EEAD4">.</tspan></text>
      <text x="56" y="218" font-size="22" fill="#BED0DF" letter-spacing="0.6">Build. <tspan fill="#F0F6FC">Ship.</tspan> Operate.</text>
    </g>

    <g stroke="url(#accent)" stroke-width="1.5">
      <path d="M817 106H776V174H817M1059 106H1100V174H1059" stroke-opacity="0.5" />
      <path d="M938 42V69M938 211V238" stroke-opacity="0.5" />
      <rect x="817" y="69" width="242" height="142" rx="14" fill="#101E2C" />
      <path d="M817 102H1059" stroke-opacity="0.35" />
    </g>
    <circle cx="836" cy="86" r="3" fill="#58A6FF" />
    <circle cx="849" cy="86" r="3" fill="#82BCD7" opacity="0.65" />
    <circle cx="862" cy="86" r="3" fill="#5EEAD4" opacity="0.65" />
    <path d="M861 133L883 151L861 169M903 172H940" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="776" cy="106" r="4" fill="#58A6FF" />
    <circle cx="1100" cy="174" r="4" fill="#5EEAD4" />
    <circle cx="938" cy="42" r="3" fill="#75C6EB" />
    <circle cx="938" cy="238" r="3" fill="#75C6EB" />
  </g>
</svg>
